name: Deploy account deletion page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy deletion function
        run: npx --yes supabase@2.118.0 functions deploy delete-account --project-ref qtudcokmkwriylfsiqcm --no-verify-jwt
